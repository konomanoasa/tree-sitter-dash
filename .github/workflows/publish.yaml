name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          readonly poll_seconds=15
          while :; do
            result=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs" \
              -f branch=main -f event=push -f head_sha="$GITHUB_SHA" \
              -f per_page=100 \
              --jq '.workflow_runs | max_by(.run_number) |
                if . == null then "pending"
                elif .status != "completed" then .status
                else "completed:" + .conclusion end')
            case "$result" in
              completed:success)
                printf 'CI passed for %s\n' "$GITHUB_SHA"
                exit 0
                ;;
              completed:*)
                printf 'CI did not succeed for %s: %s\n' "$GITHUB_SHA" "$result" >&2
                exit 1
                ;;
              *)
                printf 'Waiting for CI on %s: %s\n' "$GITHUB_SHA" "$result"
                sleep "$poll_seconds"
                ;;
            esac
          done

  crates-io:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install stable --profile minimal
      - name: Verify tag matches package version
        run: |
          package_version=$(cargo +stable metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          readonly package_version
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          package_version=$(node --input-type=module --eval 'import metadata from "./package.json" with { type: "json" }; console.log(metadata.version);')
          readonly package_version
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm publish
