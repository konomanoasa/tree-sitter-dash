[project]
name = "konomanoasa-tree-sitter-dash"
version = "0.4.0"
description = "Tree-sitter grammar for Dash."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/konomanoasa/tree-sitter-dash"

[dependency-groups]
dev = [
    "poethepoet==0.49.0",
    "ruff==0.17.3",
    "setuptools==84.2.1",
    "tree-sitter==0.26.0",
    "twine==7.0.0",
    "ty==0.0.95",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = ["tree_sitter_dash", "tree_sitter_dash.queries"]

[tool.setuptools.package-dir]
tree_sitter_dash = "bindings/python"
"tree_sitter_dash.queries" = "queries"

[tool.setuptools.package-data]
tree_sitter_dash = ["*.pyi", "py.typed"]
"tree_sitter_dash.queries" = ["*.scm"]

[tool.poe]
executor.type = "simple"

[tool.poe.tasks]
build = "uv build --no-sources"
check = [
    { cmd = "ruff check setup.py bindings/python test/bindings.test.py" },
    { cmd = "ty check setup.py bindings/python test/bindings.test.py" },
    { cmd = "ruff format --check setup.py bindings/python test/bindings.test.py" },
]
format = "ruff format setup.py bindings/python test/bindings.test.py"
test = "python test/bindings.test.py"

[tool.ruff]
indent-width = 4
line-length = 80

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
